name: Scorecard

# OpenSSF Scorecard: scores the repository's security practices and publishes the result
# (scorecard.dev, the README badge) and to the Security tab. The publishing API rejects workflows
# with top-level env vars, defaults or write permissions, and steps outside its approved list.
on:
  push:
    branches: [main]
  schedule:
    - cron: "30 4 * * 1"
  branch_protection_rule:
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Upload the results to code scanning.
      security-events: write
      # Sign the published results with GitHub's OIDC token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
